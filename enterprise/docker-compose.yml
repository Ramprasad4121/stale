version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - RUST_LOG=info
      - DATABASE_URL=postgres://stale:stale@postgres:5432/stale_enterprise
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stale-net

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - PORT=3000
    depends_on:
      - api
    networks:
      - stale-net

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=stale
      - POSTGRES_PASSWORD=stale
      - POSTGRES_DB=stale_enterprise
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - stale-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - stale-net

  # ClickHouse for audit logs (prod)
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - stale-net
    profiles:
      - prod

volumes:
  postgres-data:
  clickhouse-data:

networks:
  stale-net:
    driver: bridge
