# SECURITY: This compose file is for LOCAL DEMO ONLY.
# - Plaintext demo credentials are DEMO-ONLY, never for production/SOC2.
# - Production MUST use external secrets (existingSecret / external-secrets operator) + env_file.
# - See enterprise/infra/k8s/values.yaml for secure pattern with existingSecret.
# - For local, override via env_file: .env.local (not committed) or export POSTGRES_PASSWORD.
version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - RUST_LOG=info
      # DEMO-ONLY: In production, use existingSecret + external-secrets operator
      # Override via env_file: .env.local or environment variable injection
      - DATABASE_URL=${DATABASE_URL:-postgres://stale:${POSTGRES_PASSWORD:-demo_only_local}@postgres:5432/stale_enterprise}
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env.local # optional, not committed - for local secret overrides
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - stale-net

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - PORT=3000
    depends_on:
      - api
    networks:
      - stale-net

  postgres:
    image: postgres:15-alpine
    environment:
      # DEMO-ONLY credentials - production uses existingSecret stale-postgres-secret
      - POSTGRES_USER=${POSTGRES_USER:-stale}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-demo_only_local}
      - POSTGRES_DB=stale_enterprise
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - stale-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - stale-net

  # ClickHouse for audit logs (prod profile only)
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - stale-net
    profiles:
      - prod

volumes:
  postgres-data:
  clickhouse-data:

networks:
  stale-net:
    driver: bridge
