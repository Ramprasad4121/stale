replicaCount: 3

image:
  repository: ghcr.io/stale-enterprise/api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3001"

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
  hosts:
    - host: api.stale.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: stale-enterprise-tls
      hosts:
        - api.stale.yourdomain.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: stale-enterprise
        topologyKey: kubernetes.io/hostname

env:
  RUST_LOG: "info"
  PORT: "3001"
  # SECURITY: Use external-secrets operator or envFrom secret in production
  # Do NOT hardcode DATABASE_URL with password in values.yaml
  # Example: DATABASE_URL from secret ref

license:
  enabled: true
  key: "" # Set via --set license.key=eyJ... or via external-secrets

# Postgres - use managed RDS in production, password via external-secrets
postgres:
  enabled: true
  auth:
    username: stale
    # SECURITY: Do NOT hardcode password - use existingSecret or external-secrets
    # For demo only - production must use external-secrets operator
    existingSecret: "stale-postgres-secret"
    secretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "password"
      replicationPasswordKey: "replication-password"
    database: stale_enterprise
  primary:
    persistence:
      enabled: true
      size: 20Gi

redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: "stale-redis-secret"
    existingSecretPasswordKey: "password"
  master:
    persistence:
      enabled: true
      size: 8Gi

clickhouse:
  enabled: true
  auth:
    username: default
    existingSecret: "stale-clickhouse-secret"
  persistence:
    enabled: true
    size: 100Gi

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

dashboard:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/stale-enterprise/dashboard
    tag: "1.0.0"
  service:
    port: 3000
  ingress:
    enabled: true
    hosts:
      - host: app.stale.yourdomain.com
        paths:
          - path: /
            pathType: Prefix

secrets:
  create: false # Use external-secrets operator in production
  # Example: external-secrets.io - do not store plaintext passwords in values.yaml
