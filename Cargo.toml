[package]
name = "stale"
version = "1.0.2"
edition = "2021"
authors = ["Ramprasad Goud <ramprasadgoud34@gmail.com>"]
description = "Fail-closed DeFi security guardrails for autonomous AI agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Ramprasad4121/stale"
keywords = ["guardrail", "defi", "chainlink", "ai-agents", "security"]
categories = ["cryptography::cryptocurrencies", "development-tools"]
include = [
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync", "io-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"

[[bin]]
name = "stale"
path = "src/bin/stale.rs"

[[bin]]
name = "stale-mcp"
path = "src/bin/stale_mcp.rs"

[lib]
name = "stale"
path = "src/lib.rs"
