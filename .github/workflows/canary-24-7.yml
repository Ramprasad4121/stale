name: 24/7 Mainnet Canary Watcher

on:
  schedule:
    # Runs every 6 hours around the clock
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: canary-watcher
  cancel-in-progress: false

jobs:
  canary:
    name: Live On-Chain Canary Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Live Mainnet & Arbitrum Verification
        id: run_audit
        run: |
          cargo run --example live_mainnet_audit

      - name: Create Alert Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `🚨 [CANARY FAILURE] Live On-Chain Guardrail Alert (${new Date().toISOString().split('T')[0]})`;
            const body = `### ⚠️ Live On-Chain Canary Failure Detected\n\n` +
              `The scheduled 24/7 Canary Watcher detected an on-chain failure or RPC divergence during \`live_mainnet_audit.rs\`.\n\n` +
              `* **Run URL**: ${runUrl}\n` +
              `* **Trigger**: Scheduled Cron (every 6 hours)\n` +
              `* **Target Networks**: Ethereum Mainnet, Arbitrum One\n\n` +
              `Please investigate whether an upstream Chainlink feed was updated/deprecated, or if a public RPC endpoint is experiencing degraded service.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'canary-alert']
            });
